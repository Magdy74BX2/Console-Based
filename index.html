<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تكليف نتائج الطلاب </title>
</head>
<body>
   <script>


// 1. هيكلة بيانات الطالب (Class & Constructor)
class Student {
  constructor(id, name, grades, attendance) {
    this.id = id;
    this.name = name;
    this.grades = grades;         // مصفوفة تحتوي على درجات 3 مواد
    this.attendance = attendance; // نسبة الحضور (%)
  }

  // 2. دوال التحليل الأكاديمي (Methods)
  
  // دالة حساب المتوسط باستخدام reduce
  calculateAverage() {
    const totalSum = this.grades.reduce((accumulator, currentGrade) => accumulator + currentGrade, 0);
    return totalSum / this.grades.length;
  }

  // دالة تحديد التقدير بالحروف بناءً على المتوسط
  getGradeLetter(average) {
    if (average >= 90) return 'A';
    if (average >= 80) return 'B';
    if (average >= 70) return 'C';
    if (average >= 60) return 'D';
    if (average >= 50) return 'E';
    return 'F';
  }

  // دالة النتيجة النهائية (شترط المتوسط >= 50 والحضور >= 75%)
  getStatus(average) {
    if (average >= 50 && this.attendance >= 75) {
      return 'ناجح';
    } else {
      return 'يحتاج مراجعة';
    }
  }
}

// 3. نظام تشغيل الجامعة (Objects Array)
const studentsList = [
  new Student(101, 'أحمد محمد', [85, 92, 88], 90),
  new Student(102, 'سارة علي', [42, 45, 44], 82),    // متعثر (متوسط 43.67)
  new Student(103, 'محمود حسن', [65, 70, 60], 68),    // راسب بسبب الحضور (< 75%)
  new Student(104, 'فاطمة إبراهيم', [46, 48, 47], 88) // متعثر (متوسط 47.00)
];

// --- 5. المخرجات (Console Logging) - التقرير الشامل ---
console.log("==========================================");
console.log("       تقرير نظام نتائج الطلاب الأكاديمي      ");
console.log("==========================================");

studentsList.forEach(student => {
  const avg = student.calculateAverage();
  const letter = student.getGradeLetter(avg);
  const status = student.getStatus(avg);
  
  console.log(`رقم الجلوس: ${student.id} | الاسم: ${student.name}`);
  console.log(`  - المتوسط: ${avg.toFixed(2)} | التقدير: ${letter} | الحالة: ${status}`);
  console.log("------------------------------------------");
});


// 4. لجنة الرأفة (Array Methods)

const strugglingStudents = studentsList.filter(student => {
  const avg = student.calculateAverage();
  return avg >= 40 && avg < 49.99;
});

// ب. المعالجة (Map): إضافة 5 درجات رأفة لمتوسطات الطلاب المتعثرين
const mercyProcessedStudents = strugglingStudents.map(student => {
  const originalAvg = student.calculateAverage();
  const adjustedAvg = originalAvg + 5;
  
  return {
    id: student.id,
    name: student.name,
    originalAverage: originalAvg,
    adjustedAverage: adjustedAvg,
    newStatus: adjustedAvg >= 50 ? 'ناجح بعد الرأفة' : 'يحتاج مراجعة إضافية'
  };
});

// ج. التحليل (Reduce): جمع المتوسطات الجديدة بعد التعديل
const totalAdjustedAverages = mercyProcessedStudents.reduce((sum, student) => sum + student.adjustedAverage, 0);

// د. متوسط الرأفة مع درع الحماية لمنع القسمة على صفر (Guard Shield)
const mercyAverage = mercyProcessedStudents.length > 0 
  ? totalAdjustedAverages / mercyProcessedStudents.length 
  : 0;


// --- المخرجات الخاصة بلجنة الرأفة ---
console.log("\n==========================================");
console.log("            نتائج لجنة الرأفة             ");
console.log("==========================================");

if (mercyProcessedStudents.length > 0) {
  console.log(`عدد الطلاب المشمولين بالرأفة: ${mercyProcessedStudents.length}`);
  console.log("تفاصيل تعديلات الطلاب المتعثرين:");
  
  mercyProcessedStudents.forEach(s => {
    console.log(`- الطالب: ${s.name} | المتوسط السابق: ${s.originalAverage.toFixed(2)} | المتوسط بعد الرأفة (+5): ${s.adjustedAverage.toFixed(2)} | النتيجة: ${s.newStatus}`);
  });
  
  console.log("------------------------------------------");
  console.log(`متوسط درجات الطلاب المتعثرين بعد التعديل: ${mercyAverage.toFixed(2)}`);
} else {
  console.log("درع الحماية مفعل: لا يوجد طلاب في فئة الرأفة حالياً.");
}
console.log("==========================================");

</script> 

<h1>(Console) نتيجـة التكلـيف فى فتحـة  </h1>



</body>
</html>
